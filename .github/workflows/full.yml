#  full: the harnesses with their slow cases, weekly and on demand (ADR
#  0041). The slow cases are the ones the assertion-enabled build cannot
#  afford on every push: the P-256 Ligero verifier end to end, about
#  twelve minutes on the author's machine, where a P-256 multiplication
#  with its executed contracts costs 38 ms and an inversion 6 s. The
#  gate on every push (verify.yml) runs the same harnesses without them;
#  this workflow is the record that they still pass on the pinned
#  toolchain, on Linux. The runner is the repository variable
#  FULL_RUNNER when set (a larger hosted runner, with a faster CPU: the
#  harnesses are single-threaded), ubuntu-latest otherwise.
#  Scheduled workflows are suspended by GitHub after sixty days without
#  activity on the repository; a manual run resumes them.

name: full

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full:
    runs-on: ${{ vars.FULL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Alire and the pinned toolchain
        uses: alire-project/setup-alire@latest
        with:
          toolchain: "gnat_native=16.1.0 gprbuild=26.0.1"

      - name: Toolchain versions
        run: alr -n toolchain

      - name: Build
        run: make build

      - name: Partitions cover the project
        run: make partitions-check

      - name: Test, slow cases included
        run: make test-slow

      - name: Vectors
        run: make vectors

      - name: Lint
        run: make lint
