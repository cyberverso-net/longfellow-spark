#  prove: the full proof on the project's own proving machine (ADR 0060;
#  earlier ADR 0019, 0021, 0033, 0034, 0045, 0054). It runs on every pull
#  request to main, weekly as an independent record that the proof still
#  holds on the pinned toolchain, and on demand before a release or after
#  a toolchain change. Its one check, `prove`, is required for merging
#  and, with `verify`, is the gate for every change (ADR 0062).
#
#  A pull request that changes only text (Markdown files and LICENSE)
#  does not start the machine: the job `changes` sees it in seconds, the
#  two jobs below are skipped, and GitHub counts a skipped required
#  check as passed. Any other file, the weekly run and a manual run
#  prove in full.
#
#  Then two jobs. start-runner, on a hosted runner, authenticates to Google
#  Cloud through Workload Identity Federation (no key in the repository)
#  and starts the virtual machine prove-runner, which registers its
#  self-hosted runner at boot and shuts itself down after the job. prove
#  runs there: 24 cores, the toolchain installed once, the whole proof in
#  one job (`make prove`, one prover per core), where the hosted runners
#  of four cores needed nine partitions and still exceeded a sixty
#  minute limit on one of them (ADR 0054). The partitions of
#  scripts/prove-partitions.txt remain for make prove-partition locally;
#  the check that they cover the project still runs here.
#  Scheduled workflows are suspended by GitHub after sixty days without
#  activity on the repository; a manual run resumes them.

name: prove

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: code or text only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Files changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
             echo "code=true" >> "$GITHUB_OUTPUT"
             exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          echo "$files"
          code="$(echo "$files" | grep -v -E '(\.md$|^LICENSE$)' | grep -c . || true)"
          if [ "$code" -gt 0 ]; then
             echo "code=true" >> "$GITHUB_OUTPUT"
          else
             echo "Text only: the proving machine is not started."
             echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  start-runner:
    name: start the proving machine
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_RUNNER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Start prove-runner
        run: |
          status="$(gcloud compute instances describe prove-runner \
                      --zone europe-west4-c --project longfellow-512114 \
                      --format='value(status)')"
          echo "prove-runner is $status"
          if [ "$status" != "RUNNING" ]; then
             gcloud compute instances start prove-runner \
                --zone europe-west4-c --project longfellow-512114
          fi

  prove:
    name: prove
    needs: [changes, start-runner]
    runs-on: [self-hosted, linux, x64, prove]
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          alr -n toolchain
          alr -n exec -- gnatprove --version

      - name: Build
        run: make build

      - name: Partitions cover the project
        run: make partitions-check

      - name: Prove
        run: make prove

      - name: Upload the GNATprove report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnatprove-report
          path: obj/development/gnatprove/gnatprove.out
