#  prove: the full proof on the hosted runner, weekly and on demand
#  (ADR 0019). It is not a required check: the proof gates each push
#  locally through .githooks/pre-push, where it takes about three
#  minutes; here it takes fifteen to twenty-five, so it runs on a
#  schedule as an independent record that the proof still holds on the
#  pinned toolchain, and by hand before a release or after a toolchain
#  change. Scheduled workflows are suspended by GitHub after sixty days
#  without activity on the repository; a manual run resumes them.

name: prove

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Alire and the pinned toolchain
        uses: alire-project/setup-alire@latest
        with:
          toolchain: "gnat_native=16.1.0 gprbuild=26.0.1"

      - name: Toolchain versions
        run: |
          alr -n toolchain
          alr -n exec -- gnatprove --version

      - name: Build
        run: make build

      - name: Prove
        run: make prove

      - name: Upload the GNATprove report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnatprove-report
          path: obj/development/gnatprove/gnatprove.out
