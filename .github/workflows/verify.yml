#  verify: the gate on every push and pull request (ADR 0018, ADR 0019).
#  Runs build, test, vectors and lint from scripts/check.sh, one workflow
#  step each so that the failing one is visible, with the same
#  Alire-provisioned toolchain as the local development environment.
#  The proof is not part of this gate: it runs locally before every push
#  (.githooks/pre-push) and on the hosted runner weekly and on demand
#  (prove.yml).

name: verify

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Alire and the pinned toolchain
        uses: alire-project/setup-alire@latest
        with:
          toolchain: "gnat_native=16.1.0 gprbuild=26.0.1"

      - name: Toolchain versions
        run: alr -n toolchain

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Vectors
        run: make vectors

      - name: Lint
        run: make lint
