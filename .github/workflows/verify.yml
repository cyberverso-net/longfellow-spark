#  verify: the gate on every push and pull request (ADR 0018, ADR 0019).
#  Runs build, test, vectors and lint from scripts/check.sh, one workflow
#  step each so that the failing one is visible, with the same
#  Alire-provisioned toolchain as the local development environment.
#  The proof is not part of this job: it runs on demand on the project's
#  proving machine through scripts/remote-check.sh, which posts the
#  required status `prove` on the commit (ADR 0062). The harnesses run concurrently
#  (scripts/check.sh test), every case of both fields: since ADR 0044
#  the field contracts are proof-only and the step takes seconds; the
#  limit below keeps the margin of the earlier, slower runs.

name: verify

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Alire and the pinned toolchain
        uses: alire-project/setup-alire@latest
        with:
          toolchain: "gnat_native=16.1.0 gprbuild=26.0.1"

      - name: Toolchain versions
        run: alr -n toolchain

      - name: Build
        run: make build

      - name: Partitions cover the project
        run: make partitions-check

      - name: Test
        run: make test

      - name: Command-line verifier
        run: make cli

      - name: Vectors
        run: make vectors

      - name: Lint
        run: make lint
