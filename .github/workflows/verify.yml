#  verify: the gate on every push and pull request (ADR 0018, ADR 0019).
#  Runs build, test, vectors and lint from scripts/check.sh, one workflow
#  step each so that the failing one is visible, with the same
#  Alire-provisioned toolchain as the local development environment.
#  The proof is not part of this job: it runs on demand on the project's
#  proving machine through scripts/remote-check.sh, which posts the
#  required status `prove` on the commit (ADR 0062). The harnesses run concurrently
#  (scripts/check.sh test), every case of both fields: since ADR 0044
#  the field contracts are proof-only and the step takes seconds; the
#  limit below keeps the margin of the earlier, slower runs.

name: verify

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      #  The toolchain versions, read from alire.toml: one source of truth.
      - name: Toolchain pinned in alire.toml
        id: pins
        run: |
          gnat=$(sed -n 's/^gnat_native = "=\(.*\)"$/\1/p' alire.toml)
          gpr=$(sed -n 's/^gprbuild = "=\(.*\)"$/\1/p' alire.toml)
          test -n "$gnat" && test -n "$gpr"
          echo "toolchain=gnat_native=$gnat gprbuild=$gpr" >> "$GITHUB_OUTPUT"

      - name: Set up Alire and the pinned toolchain
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          toolchain: ${{ steps.pins.outputs.toolchain }}

      - name: Toolchain versions
        run: alr -n toolchain

      - name: Build
        run: make build

      - name: Partitions cover the project
        run: make partitions-check

      - name: Test
        run: make test

      - name: Command-line verifier
        run: make cli

      - name: Vectors
        run: make vectors

      - name: Lint
        run: make lint

  #  lean: the Lean proofs of lean/ that the SPARK proof cites (ADR 0091,
  #  chapter 10 Section 2.8), in a job of its own beside verify, so that
  #  a reader can check them without the proving machine. elan installs
  #  the Lean of lean/lean-toolchain; Mathlib's compiled files come from
  #  its cache, kept between runs by actions/cache under a key of the
  #  manifest and the toolchain. Not a required check: its place in the
  #  gate is decided on its measured times (ADR 0091, Status).
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Mathlib's cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mathlib
          key: mathlib-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}

      - name: Lean
        run: LONGFELLOW_LEAN=1 make lean

