name = "longfellow_spark"
description = "Formally verified Ada/SPARK reimplementation of Longfellow ZK (libzk)"
version = "0.2.0"

authors = ["Paolo De Rosa"]
maintainers = ["Paolo De Rosa <paolo.de.rosa@linux.com>"]
licenses = "Apache-2.0"
website = ""
tags = []

[[depends-on]]
gnatprove = "=16.1.0"

[[depends-on]]
sparklib = "=16.1.0"

#  SPARKlib's ghost entities must have the same assertion policy as the
#  ghost code of this project that refers to them; the test project
#  builds with assertions on (ADR 0010), so the library is built with
#  assertions too (ghost-only use, ADR 0031).
[gpr-set-externals]
SPARKLIB_BUILD = "Assertions"
